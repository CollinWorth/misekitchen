name: Merge on approval

# A Claude PR (branch claude/...) is squash-merged only when the owner approves it.
# --match-head-commit means an approval of an older commit can never merge newer code.
on:
  pull_request_review:
    types: [submitted]

jobs:
  merge:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'CollinWorth' &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --squash --delete-branch \
            --match-head-commit "${{ github.event.review.commit_id }}"
